<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Factory — Rendering Prompt Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <!-- ============ Masthead ============ -->
    <header class="masthead">
      <div class="mast-left">
        <h1 class="title">Prompt&nbsp;Factory</h1>
        <p class="tagline">Turn an unrendered Revit / CAD view into a crafted prompt for any AI image generator.</p>
      </div>
      <button class="link-btn" id="resetBtn">Reset</button>
    </header>

    <!-- ============ Controls ============ -->
    <section class="controls">
      <div class="preset-row">
        <label class="lbl" for="preset">Preset</label>
        <select id="preset" class="preset-select"></select>
      </div>

      <div class="controls-grid">
        <div class="control" id="field-style"></div>
        <div class="control" id="field-lighting"></div>
        <div class="control" id="field-material"></div>
        <div class="control" id="field-background"></div>
        <div class="control" id="field-entourage"></div>
        <div class="control" id="field-weather"></div>
        <div class="control">
          <label class="lbl" for="aspect">Aspect ratio</label>
          <select id="aspect"></select>
        </div>
        <div class="control">
          <label class="lbl" for="quality">Quality</label>
          <select id="quality"></select>
        </div>
      </div>

      <div class="control custom-control">
        <label class="lbl" for="custom">Custom directions</label>
        <input id="custom" type="text" placeholder="e.g. add rooftop solar panels, emphasize the main entrance…" />
      </div>
    </section>

    <hr class="rule" />

    <!-- ============ Prompt (the hero) ============ -->
    <section class="stage">
      <div class="stage-head">
        <span class="kicker">The Prompt</span>
        <div class="stage-actions">
          <span class="copied" id="copied" hidden>Copied ✓</span>
          <button class="copy-btn" id="copyBtn">Copy prompt</button>
        </div>
      </div>

      <p class="lede">Paste this alongside your exported view in Gemini, Imagen, DALL·E, Midjourney or any image model.</p>

      <div id="output" class="prompt" tabindex="0"></div>

      <p class="count" id="charCount"></p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
