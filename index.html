<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Factory — Rendering Prompt Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <!-- ============ Masthead ============ -->
    <header class="masthead">
      <div class="mast-left">
        <h1 class="title">Prompt&nbsp;Factory</h1>
        <p class="tagline">Create rich, detailed prompts for AI image generators to create images from unrendered Revit / CAD views.</p>
      </div>
      <button class="link-btn" id="resetBtn">Reset</button>
    </header>

    <!-- ============ Controls ============ -->
    <section class="controls">
      <div class="preset-row" id="presetRow">
        <span class="lbl" id="presetLabel">Preset</span>
        <button type="button" class="preset-btn" id="presetBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="presetLabel">
          <span id="presetText">Preset</span>
          <svg class="preset-caret" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <ul class="preset-pop" id="presetPop" role="listbox" hidden></ul>
      </div>

      <div class="controls-grid">
        <div class="control" id="field-style"></div>
        <div class="control" id="field-lighting"></div>
        <div class="control" id="field-material"></div>
        <div class="control" id="field-background"></div>
        <div class="control" id="field-entourage"></div>
        <div class="control" id="field-weather"></div>
        <div class="control">
          <label class="lbl" for="aspect">Aspect ratio</label>
          <select id="aspect"></select>
        </div>
        <div class="control">
          <label class="lbl" for="quality">Quality</label>
          <select id="quality"></select>
        </div>
      </div>

      <div class="control custom-control">
        <label class="lbl" for="custom">Custom directions</label>
        <input id="custom" type="text" placeholder="e.g. add rooftop solar panels, emphasize the main entrance…" />
      </div>
    </section>

    <hr class="rule" />

    <!-- ============ Prompt (the hero) ============ -->
    <section class="stage">
      <div class="stage-head">
        <span class="kicker">The Prompt</span>
        <div class="stage-actions">
          <span class="copied" id="copied" hidden>Copied ✓</span>
          <button class="copy-btn" id="copyBtn">Copy prompt</button>
        </div>
      </div>

      <p class="lede">Paste this alongside your exported view in Gemini, Imagen, DALL·E, Midjourney or any image model.</p>

      <div id="output" class="prompt" tabindex="0"></div>

      <p class="count" id="charCount"></p>
    </section>
  </main>

  <div class="scrim" id="scrim"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
